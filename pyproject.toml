[project]
name = "gmail-deleter"
version = "0.1.0"
description = "Permanently delete Gmail messages in bulk"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = [
    "google-api-python-client==2.136.0",
    "httplib2==0.22.0",
    "oauth2client==4.1.3",
    "tqdm==4.66.4",
]

[project.scripts]
gmail-deleter = "gmail_deleter:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["gmail_deleter", "gmail_handler", "google_client"]

[tool.black]
line-length = 120
target-version = ["py314"]
skip-string-normalization = true

[dependency-groups]
dev = [
    "black==25.11.0",
]
